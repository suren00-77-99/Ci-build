name: CI - Lint and Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  lint-and-validate:
    name: lint  
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------------
      # 2. Setup Python
      # ------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ------------------------------------------------
      # 3. Install linting tools
      # ------------------------------------------------
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # ------------------------------------------------
      # 4. Python syntax validation
      # ------------------------------------------------
      - name: Python syntax validation
        run: |
          python -m compileall frontend backend

      # ------------------------------------------------
      # 5. Flake8 - Frontend
      # ------------------------------------------------
      - name: Lint frontend
        run: |
          flake8 frontend \
            --exclude=venv,.venv,__pycache__ \
            --max-line-length=100

      # ------------------------------------------------
      # 6. Flake8 - Backend
      # ------------------------------------------------
      - name: Lint backend
        run: |
          flake8 backend \
            --exclude=venv,.venv,__pycache__ \
            --max-line-length=100

      # ------------------------------------------------
      # 7. Validate Dockerfiles
      # ------------------------------------------------
      - name: Validate Dockerfiles
        run: |
          docker run --rm \
            -i \
            hadolint/hadolint \
            < frontend/Dockerfile

          docker run --rm \
            -i \
            hadolint/hadolint \
            < backend/Dockerfile

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs: lint-and-validate

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          echo "IMAGE_VERSION=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Display image tag
        run: |
          echo "Image version: $IMAGE_VERSION"

      - name: Build frontend image
        run: |
           docker build \
            -t python-frontend:${IMAGE_VERSION} \
            -t python-frontend:latest \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t python-backend:${IMAGE_VERSION} \
            -t python-backend:latest \
            ./backend

      - name: List Docker images
        run: |
          docker images